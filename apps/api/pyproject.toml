[project]
name = "sowo-api"
version = "0.1.0"
description = "Backend for the Sowo WhatsApp AI sales assistant"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "sqlalchemy>=2.0,<3.0", "pydantic-settings>=2.6,<3.0", "httpx>=0.27,<1.0", "psycopg[binary]>=3.2,<4.0", "alembic>=1.13,<2.0"]

[dependency-groups]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
